# /etc/nginx/sites-available/shop-postgres.conf
# The app trusts X-Forwarded-For only from configured proxies: set
#   HTTP_TRUSTED_PROXIES=127.0.0.1/32
# For HTTPS run: sudo certbot --nginx -d api.example.com
upstream shop-postgres_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Keep in step with HTTP_MAX_BODY_BYTES (default 1 MiB).
    client_max_body_size 1m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://shop-postgres_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
