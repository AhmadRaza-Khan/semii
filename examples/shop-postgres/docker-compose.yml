# Local services. Database only (for `semii dev`): docker compose up -d db
# Whole stack in containers:                       docker compose up --build
services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/shop_postgres?sslmode=disable
      HTTP_ADDR: ":8080"
      DB_AUTO_MIGRATE: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop_postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop_postgres"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata:
